name: lesson

# Runs the full lesson on Linux, macOS and Windows and fails if any of the
# four cases (1 PASS, 3 BLOCKED) ends differently. demo.sh asserts each
# case by cilock's exit code and the reason in its log, and exits non-zero
# on any mismatch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: Build cilock from rookery (pinned)
        run: scripts/install-cilock.sh

      - name: Show toolchain
        run: |
          echo "compiler: $(command -v cc || command -v gcc || command -v clang || echo none)"
          (cc --version || gcc --version || clang --version) 2>/dev/null | head -1
          python3 --version || python --version
          openssl version
          tar --version | head -1

      - name: Run the lesson
        env:
          DEMO_FAST: "1"
        run: |
          EXE=""; [[ "$RUNNER_OS" == Windows ]] && EXE=.exe
          CILOCK="$PWD/bin/cilock$EXE" ./demo.sh

      - name: Upload evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lesson-${{ matrix.os }}
          path: |
            lesson-work/evidence/
            lesson-work/policy/
            lesson-work/logs/
          if-no-files-found: warn
